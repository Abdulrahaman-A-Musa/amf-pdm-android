name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js 20 from NodeSource
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node -v
          npm -v

      - name: Install Java 17
        run: |
          sudo apt-get install -y openjdk-17-jdk
          java -version

      - name: Install npm dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android 2>/dev/null || true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Fix gradlew line endings and permissions
        run: |
          sed -i 's/\r//' android/gradlew
          chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMF-PDM-Analyser-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
