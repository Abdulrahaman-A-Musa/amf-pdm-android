name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository (no checkout action)
        run: |
          git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .

      - name: Activate Node.js via nvm
        run: |
          . "$NVM_DIR/nvm.sh"
          nvm install 20
          nvm use 20
          NODE_VER=$(node -v)
          echo "$NVM_DIR/versions/node/$NODE_VER/bin" >> $GITHUB_PATH
          node -v && npm -v

      - name: Install Java 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-17-jdk
          java -version

      - name: Install npm dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android 2>/dev/null || true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Fix gradlew line endings and permissions
        run: |
          sed -i 's/\r//' android/gradlew
          chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" \
            --title "APK Build #${{ github.run_number }}" \
            --notes "Android debug APK — built from commit ${{ github.sha }}" \
            "android/app/build/outputs/apk/debug/app-debug.apk#AMF-PDM-Analyser.apk"
